<!-- Loading bar -->
<fuse-loading-bar></fuse-loading-bar>

<div class="bg-default flex w-full flex-auto justify-center">
	<!-- Navigation -->
	@if (isScreenSmall) {
		<fuse-vertical-navigation
			class="dark bg-forest-ink print:hidden"
			[mode]="'over'"
			[name]="'mainNavigation'"
			[navigation]="navigation.default"
			[opened]="false"
		>
			<!-- Navigation header hook -->
			<ng-container fuseVerticalNavigationContentHeader>
				<!-- Logo -->
				<div class="flex h-20 items-center px-8 pt-6">
					<img class="h-8 w-auto" [src]="getLogoSrc()" alt="Zelf logo" />
				</div>
			</ng-container>
		</fuse-vertical-navigation>
	}

	<!-- Wrapper -->
	<div class="flex min-w-0 flex-auto flex-col items-center">
		<!-- Header (Wise: Paper bar, hairline bottom, pill nav segments) -->
		<div class="bg-default sticky top-0 z-49 flex w-full flex-0 justify-center border-b print:hidden">
		<div class="flex h-16 w-full max-w-[1280px] items-center px-4 sm:h-20 md:px-6">
			@if (!isScreenSmall) {
				<!-- Logo -->
				<div class="mx-2 flex items-center lg:mr-8">
					<div class="hidden lg:flex">
						<!-- Logo with proper dark mode handling -->
						<img class="h-8 w-auto" [src]="getLogoSrc()" alt="Zelf logo" />
					</div>
					<!-- Small version -->
					<img class="flex h-8 w-auto lg:hidden" [src]="getLogoSrc()" alt="Logo image" />
				</div>
				<!-- Horizontal navigation -->
				<fuse-horizontal-navigation class="mr-2" [name]="'mainNavigation'" [navigation]="activeNavigation"></fuse-horizontal-navigation>
			}
			<!-- Navigation toggle button -->
			@if (isScreenSmall) {
				<button class="mr-2" mat-icon-button (click)="toggleNavigation('mainNavigation')">
					<mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
				</button>
			}
			<!-- Components -->
			<div class="ml-auto flex items-center space-x-1 pl-2 sm:space-x-2">
				<languages></languages>
				<!-- <fuse-fullscreen class="hidden md:block"></fuse-fullscreen> -->
				<search [appearance]="'bar'"></search>
				<!-- Documentation Button -->
				<button
					mat-icon-button
					class="hidden md:block"
					(click)="openDocumentation()"
					matTooltip="API Documentation"
					matTooltipPosition="below"
				>
					<mat-icon>description</mat-icon>
				</button>
				<!-- <shortcuts></shortcuts> -->
				<!-- <messages></messages> -->
				<!-- <notifications></notifications> -->
				<theme-toggle></theme-toggle>
				@if (!isPortfolioMode) {
					<user></user>
				}
			</div>
		</div>
		</div>

		<!-- Content -->
		<div class="bg-default flex w-full max-w-[1280px] flex-auto flex-col">
			<!-- *ngIf="true" hack is required here for router-outlet to work correctly.
                 Otherwise, layout changes won't be registered and the view won't be updated! -->
			@if (true) {
				<router-outlet></router-outlet>
			}
		</div>

		<!-- Footer (Wise inverted section: Forest Ink with lime punctuation) -->
		<div class="wise-inverse relative z-49 flex w-full flex-0 justify-center print:hidden">
			<div class="flex w-full max-w-[1280px] items-center justify-between gap-4 px-6 py-6 sm:px-8 sm:py-8">
				<img class="h-7 w-auto" src="images/logo/logo-text-on-dark.svg" alt="Zelf logo" />
				<span class="text-sm font-semibold text-linen-mist">Zelf &copy; {{ currentYear }}</span>
			</div>
		</div>
	</div>
</div>
