<div class="flex w-full min-w-0 flex-col sm:absolute sm:inset-0 sm:overflow-hidden">
	<mat-drawer-container class="flex-auto sm:h-full">
		<!-- Drawer -->
		<mat-drawer class="border-r sm:w-96" [autoFocus]="false" [mode]="drawerMode" [opened]="drawerOpened" #drawer>
			<!-- Header -->
			<div class="m-8 mr-6 flex items-center justify-between sm:my-10">
				<!-- Title -->
				<div class="wise-page-title">Settings</div>
				<!-- Close button -->
				<div class="lg:hidden">
					<button mat-icon-button (click)="drawer.close()">
						<mat-icon [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
					</button>
				</div>
			</div>
			<!-- Panel links -->
			<div class="flex flex-col gap-1 px-4 pb-8">
				@for (panel of panels; track trackByFn($index, panel)) {
					<div
						class="flex cursor-pointer rounded-2xl px-4 py-4 transition-colors"
						[ngClass]="{
							'hover:bg-linen-mist dark:hover:bg-hover': !selectedPanel || selectedPanel !== panel.id,
							'bg-forest-ink text-white dark:bg-lime-voltage dark:text-forest-ink': selectedPanel && selectedPanel === panel.id,
						}"
						(click)="goToPanel(panel.id)"
					>
						<mat-icon
							[ngClass]="{
								'text-forest-ink dark:text-lime-voltage': !selectedPanel || selectedPanel !== panel.id,
								'text-lime-voltage dark:text-forest-ink': selectedPanel && selectedPanel === panel.id,
							}"
							[svgIcon]="panel.icon"
						></mat-icon>
						<div class="ml-3">
							<div
								class="font-semibold leading-6"
								[ngClass]="{
									'text-white dark:text-forest-ink': selectedPanel && selectedPanel === panel.id,
								}"
							>
								{{ panel.title }}
							</div>
							<div class="mt-0.5 text-sm" [ngClass]="selectedPanel === panel.id ? 'text-linen-mist/80 dark:text-forest-ink/70' : 'text-secondary'">
								{{ panel.description }}
							</div>
						</div>
					</div>
				}
			</div>
		</mat-drawer>

		<!-- Drawer content -->
		<mat-drawer-content class="flex flex-col">
			<!-- Main -->
			<div class="flex-auto px-6 pb-12 pt-9 md:p-8 md:pb-12 lg:p-12">
				<!-- Panel header -->
				<div class="flex items-center">
					<!-- Drawer toggle -->
					<button class="-ml-2 lg:hidden" mat-icon-button (click)="drawer.toggle()">
						<mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
					</button>

					<!-- Panel title -->
					<div class="wise-page-title ml-2 lg:ml-0">
						{{ getPanelInfo(selectedPanel).title }}
					</div>
				</div>

				<!-- Load settings panel -->
				<div class="mt-8">
					<router-outlet></router-outlet>
				</div>
			</div>
		</mat-drawer-content>
	</mat-drawer-container>
</div>
